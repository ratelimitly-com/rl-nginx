name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out rl-nginx
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check out rl-c-client
        id: rclient
        env:
          RL_CI_TOKEN: ${{ secrets.RL_CI_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -n "$RL_CI_TOKEN" ]]; then
            git clone --depth=1 "https://x-access-token:${RL_CI_TOKEN}@github.com/ratelimitly-com/rl-c-client.git" rl-c-client
          elif git ls-remote --exit-code https://github.com/ratelimitly-com/rl-c-client.git HEAD >/dev/null 2>&1; then
            git clone --depth=1 https://github.com/ratelimitly-com/rl-c-client.git rl-c-client
          else
            echo "::warning::rl-c-client is not public yet and RL_CI_TOKEN is not configured; skipping nginx module build."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcre2-dev zlib1g-dev libssl-dev

      - name: Shell syntax
        run: |
          for script in tools/build-nginx.sh tests/build-nginx.sh start-nginx.sh integration-tests/test.sh; do
            bash -n "$script"
          done

      - name: Build nginx module
        if: steps.rclient.outputs.available == 'true'
        run: RCLIENT_DIR=./rl-c-client ./tools/build-nginx.sh ./upstream-nginx --clean --debug

      - name: Check whitespace
        run: git diff --check
