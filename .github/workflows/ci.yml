name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nginx-module:
    name: nginx module
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive
          git diff --quiet --submodule=diff

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            libpcre3-dev \
            libssl-dev \
            ripgrep \
            zlib1g-dev

      - name: Build and test C client
        run: |
          make -C rl-c-client
          make -C rl-c-client test

      - name: Build nginx module
        run: bash tests/build-nginx.sh upstream-nginx --clean --debug
