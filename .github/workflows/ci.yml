name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nginx-module:
    name: nginx module
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        id: submodules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf https://github.com/
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf git@github.com:
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf ssh://git@github.com/
          if git submodule sync --recursive \
            && git submodule update --init --recursive \
            && git submodule status --recursive \
            && git diff --quiet --submodule=diff; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Private submodules are unavailable to this workflow token; skipping nginx module build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.submodules.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            libpcre3-dev \
            libssl-dev \
            ripgrep \
            zlib1g-dev

      - name: Build and test C client
        if: steps.submodules.outputs.available == 'true'
        run: |
          make -C rl-c-client
          make -C rl-c-client test

      - name: Build nginx module
        if: steps.submodules.outputs.available == 'true'
        run: bash tests/build-nginx.sh upstream-nginx --clean --debug
