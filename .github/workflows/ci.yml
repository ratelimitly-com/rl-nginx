name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nginx:
          - line: stable
            ref: release-1.30.2
            commit: a92a537860c7b87d3793d9eb41c9cf3ed833b53c
          - line: mainline
            ref: release-1.31.1
            commit: d44205284fa41662da803b796d6056fc1e59b1f3
        module_mode:
          - static
          - dynamic

    steps:
      - name: Check out rl-nginx
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dnsutils libpcre2-dev zlib1g-dev libssl-dev

      - name: Script syntax
        run: make syntax

      - name: Fetch locked rl-c-client release
        run: make fetch

      - name: Unit tests
        run: make unit

      - name: Select supported nginx release
        run: |
          git -C upstream-nginx fetch --depth=1 origin "refs/tags/${{ matrix.nginx.ref }}:refs/tags/${{ matrix.nginx.ref }}"
          git -C upstream-nginx checkout --detach "${{ matrix.nginx.commit }}"
          test "$(git -C upstream-nginx rev-parse HEAD)" = "${{ matrix.nginx.commit }}"

      - name: Build nginx module
        run: |
          if [[ "${{ matrix.module_mode }}" == "dynamic" ]]; then
            make build BUILD_FLAGS="--dynamic --compat --clean --debug"
          else
            make build BUILD_FLAGS="--clean --debug"
          fi

      - name: Dynamic module relocation test
        if: matrix.module_mode == 'dynamic'
        run: make dynamic-relocation-test

      - name: Configuration tests
        if: matrix.module_mode == 'static'
        run: make config-test

      - name: Public integration suite
        if: matrix.module_mode == 'static'
        run: make public-test

      - name: Check whitespace
        run: make whitespace

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out rl-nginx
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dnsutils libpcre2-dev zlib1g-dev libssl-dev

      - name: Fetch locked rl-c-client release
        run: make fetch

      - name: Run sanitized lifecycle gate
        run: SANITIZER_RUNS=1 KEEP_SANITIZED_BUILD=1 make sanitizers
