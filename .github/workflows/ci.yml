name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out rl-nginx
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dnsutils libpcre2-dev zlib1g-dev libssl-dev

      - name: Script syntax
        run: make syntax

      - name: Fetch locked rl-c-client release
        run: make fetch

      - name: Unit tests
        run: make unit

      - name: Build nginx module
        run: make build

      - name: Configuration tests
        run: make config-test

      - name: Public integration suite
        run: make public-test

      - name: Check whitespace
        run: make whitespace

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out rl-nginx
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dnsutils libpcre2-dev zlib1g-dev libssl-dev

      - name: Fetch locked rl-c-client release
        run: make fetch

      - name: Run sanitized lifecycle gate
        run: SANITIZER_RUNS=1 KEEP_SANITIZED_BUILD=1 make sanitizers
