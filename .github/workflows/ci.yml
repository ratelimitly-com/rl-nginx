name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out rl-nginx
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcre2-dev zlib1g-dev libssl-dev

      - name: Shell syntax
        run: |
          for script in tools/fetch-rl-c-client.sh tools/build-nginx.sh tests/build-nginx.sh start-nginx.sh integration-tests/test.sh; do
            bash -n "$script"
          done
          sh -n config

      - name: Fetch locked rl-c-client release
        run: ./tools/fetch-rl-c-client.sh

      - name: Build nginx module
        run: RCLIENT_DIR=./_deps/rl-c-client ./tools/build-nginx.sh ./upstream-nginx --clean --debug

      - name: Check whitespace
        run: git diff --check
