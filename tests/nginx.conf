# rn test nginx config
# Adjust paths and tenant settings as needed.

# If you built rn as a dynamic module, uncomment:
# load_module modules/ngx_http_rn_module.so;

events {
  debug_connection 127.0.0.1;
}

http {
  resolver 127.0.0.1 valid=30s;
  resolver_timeout 2s;

  # Keep every request-selected value inside a finite operator-controlled
  # vocabulary. Raw URI, argument, header, host, and cookie values are not
  # RateLimitly identities in this fixture.
  # `$request_uri` remains the original request target after try_files rewrites
  # `$uri`; only the finite outputs below reach RateLimitly.
  map $request_uri $rl_fixture_route {
    default                         other;
    /api/static/test                static;
    /api/dynamic/read               dynamic-read;
    /api/dynamic/write              dynamic-write;
    /api/group/test                 group;
    /api/guard/test                 guard;
    /api/guard-isolated/permissive  guard-isolated-permissive;
    /api/guard-isolated/strict      guard-isolated-strict;
  }

  map $request_method $rl_fixture_method {
    default other;
    GET     read;
    POST    write;
  }

  map "$rl_fixture_route:$rl_fixture_method" $rl_dynamic_rate {
    default              1r/s;
    dynamic-read:read    10r/s;
    dynamic-write:write  5r/s;
    guard:read           10r/s;
  }

  map $rl_fixture_route $rl_guard_threshold {
    default  80ms;
    guard    200ms;
  }

  map $rl_fixture_route $rl_guard_isolated_threshold {
    default                    500ms;
    guard-isolated-strict      1ms;
  }

  # `$ratelimitly_verdict` is allow/deny only for an authenticated decision.
  # A dash means no valid RateLimitly verdict (including fail-open/fail-close).
  log_format ratelimitly_manual
    '$remote_addr $request_method $status rl_verdict=$ratelimitly_verdict';
  access_log logs/access.log ratelimitly_manual;

  # Reserved documentation tenant; replace it and the synthetic key below
  # before using this optional harness against a real service.
  ratelimitly_tenant   tenant.example.invalid;
  # This fixed Bech32 value is synthetic test data, not a production secret.
  # It embeds auth type + tenant key_id + 32-byte credential.
  # (The commented example is rl-aes for key_id=37 with payload=sha256("tagalog").)
  # ratelimitly_auth_key rl-aes1y5qqqqqqqqqqqgqqxagymkj6ex5wfxhy3tcvlrc8a0y073uxuzq5my3jwj4wthjl23qsztxqpt;
  ratelimitly_auth_key rl-aes1qyqqqqqqqqqqq6uxkfel7d8uuxwkhqzwladr74684kjw4g30r4yuq8jjmkmcwk6tqqqqzqqqqsqqqqqsqqqyqqqqqqkqzqqq0n6jux;
  ratelimitly_policy standard unit=10ms;
  ratelimitly_fail     open;
  ratelimitly_debug    on;
  # Optional: bind UDP client socket
  # ratelimitly_bind     0.0.0.0;

  # Bucket components are fixed or selected from the finite maps above.
  ratelimitly_zone api_static
    "bucket=v1|fixture=manual|zone=static"
    rate=3r/s;

  ratelimitly_zone api_dynamic
    "bucket=v1|fixture=manual|zone=dynamic|route=$rl_fixture_route|method=$rl_fixture_method"
    rate=$rl_dynamic_rate;
  # Guard-isolation zone: high rate so guard behavior is not masked by quota/rate denies.
  ratelimitly_zone api_guard_only
    "bucket=v1|fixture=manual|zone=guard-only|route=$rl_fixture_route"
    rate=10000r/s;
  ratelimitly_group api_group zone=api_static zone=api_dynamic;
  ratelimitly_guard api_latency
    "service=v1|fixture=manual|service=api"
    threshold=$rl_guard_threshold
    ttl=30s max_samples=128 buffer_size=32 min_sample_threshold=8;
  ratelimitly_guard api_latency_isolated
    "service=v1|fixture=manual|service=guard-isolated"
    threshold=$rl_guard_isolated_threshold
    ttl=30s max_samples=128 buffer_size=32 min_sample_threshold=1;

  server {
    listen 8088;

    location = /api/static/test {
      ratelimitly_label "fixture=manual|case=static";
      ratelimitly zone=api_static;
      root tests;
      try_files /ok.txt =404;
    }

    location = /api/dynamic/read {
      ratelimitly_label "fixture=manual|case=dynamic-read";
      ratelimitly zone=api_dynamic;
      root tests;
      try_files /ok.txt =404;
    }

    location = /api/dynamic/write {
      ratelimitly_label "fixture=manual|case=dynamic-write";
      ratelimitly zone=api_dynamic;
      root tests;
      try_files /ok.txt =404;
    }

    location = /api/group/test {
      ratelimitly_label "fixture=manual|case=group";
      ratelimitly group=api_group;
      root tests;
      try_files /ok.txt =404;
    }

    location = /api/guard/test {
      ratelimitly_label "fixture=manual|case=guard";
      ratelimitly zone=api_dynamic guard=api_latency;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://127.0.0.1:18089/backend/ok.txt;
    }

    location = /api/guard-isolated/permissive {
      ratelimitly_label "fixture=manual|case=guard-isolated-permissive";
      ratelimitly zone=api_guard_only guard=api_latency_isolated;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://127.0.0.1:18089/backend/ok.txt;
    }

    location = /api/guard-isolated/strict {
      ratelimitly_label "fixture=manual|case=guard-isolated-strict";
      ratelimitly zone=api_guard_only guard=api_latency_isolated;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://127.0.0.1:18089/backend/ok.txt;
    }
  }

  # Local backend used by guard endpoints to exercise real upstream proxy path.
  server {
    listen 127.0.0.1:18089;

    location = /backend/ok.txt {
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
