# rn test nginx config
# Adjust paths and tenant settings as needed.

# If you built rn as a dynamic module, uncomment:
# load_module modules/ngx_http_rn_module.so;

events {
  debug_connection 127.0.0.1;
}

http {
  resolver 127.0.0.1 valid=30s;
  resolver_timeout 2s;

  # Dynamic example: /api/dynamic/test?user=wojtek => 10r/s, otherwise 1r/s.
  map $arg_user $rl_dynamic_rate {
    default 1r/s;
    wojtek 10r/s;
  }
  # Guard threshold example (future DSL use).
  map $arg_user $rl_guard_threshold {
    default 80ms;
    wojtek 200ms;
  }
  # Isolated guard test threshold:
  # default is permissive, guard_mode=strict is intentionally tight.
  map $arg_guard_mode $rl_guard_isolated_threshold {
    default 500ms;
    strict 1ms;
  }

  ratelimitly_tenant   rl.glar.com;
  # Bech32 auth key embeds auth type + tenant key_id + 32-byte credential
  # (example below is rl-aes for key_id=37 with payload=sha256("tagalog"))
  # ratelimitly_auth_key rl-aes1y5qqqqqqqqqqqgqqxagymkj6ex5wfxhy3tcvlrc8a0y073uxuzq5my3jwj4wthjl23qsztxqpt;
  ratelimitly_auth_key rl-aes1qvqqqqqqqqqqqgqqwv2e04veuulp6cc9sv7af4zshxegwxg3ph9evcxyeyr4yszvvd6sqg00mk;
  ratelimitly_timeout  10ms;
  ratelimitly_fail     open;
  ratelimitly_debug    on;
  # Optional: bind UDP client socket
  # ratelimitly_bind     0.0.0.0;

  # Static example (previous behavior).
  ratelimitly_zone api_static bucket="static:$uri" rate=3r/s;

  # Dynamic example (request-derived bucket + variable rate).
  ratelimitly_zone api_dynamic bucket="dynamic:$uri:user=$arg_user:sess=$cookie_session" rate=$rl_dynamic_rate;
  # Guard-isolation zone: high rate so guard behavior is not masked by quota/rate denies.
  ratelimitly_zone api_guard_only bucket="guard-only:$uri:user=$arg_user:sess=$cookie_session" rate=10000r/s;
  ratelimitly_group api_group zone=api_static zone=api_dynamic;
  ratelimitly_guard api_latency service="svc:api:$host:$uri" threshold=$rl_guard_threshold ttl=30s max_samples=128 buffer_size=128 min_sample_threshold=8;
  ratelimitly_guard api_latency_isolated service="svc:api:guard-isolated:$host:$uri" threshold=$rl_guard_isolated_threshold ttl=30s max_samples=128 buffer_size=128 min_sample_threshold=1;

  server {
    listen 8088;

    location /api/static/ {
      ratelimitly_label "STATIC:$uri";
      ratelimitly zone=api_static;
      root tests;
      try_files /ok.txt =404;
    }

    location /api/dynamic/ {
      ratelimitly_label "DYN:user=$arg_user:sess=$cookie_session";
      ratelimitly zone=api_dynamic;
      root tests;
      try_files /ok.txt =404;
    }

    location /api/group/ {
      ratelimitly_label "GROUP:$request_method:$uri:user=$arg_user:sess=$cookie_session";
      ratelimitly group=api_group;
      root tests;
      try_files /ok.txt =404;
    }

    location = /api/guard/test {
      ratelimitly_label "GUARD:$request_method:$uri:user=$arg_user:sess=$cookie_session";
      ratelimitly zone=api_dynamic guard=api_latency;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://127.0.0.1:18089/backend/ok.txt;
    }

    location = /api/guard-isolated/test {
      ratelimitly_label "GUARD_ISOLATED:$request_method:$uri:user=$arg_user:sess=$cookie_session:mode=$arg_guard_mode";
      ratelimitly zone=api_guard_only guard=api_latency_isolated;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://127.0.0.1:18089/backend/ok.txt;
    }
  }

  # Local backend used by guard endpoints to exercise real upstream proxy path.
  server {
    listen 127.0.0.1:18089;

    location = /backend/ok.txt {
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
