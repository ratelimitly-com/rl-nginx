# Minimal rl-nginx configuration.
#
# For dynamic module builds, copy the built module into nginx's modules
# directory and uncomment the load_module directive below.
#
# load_module modules/ngx_http_rn_module.so;

events {}

http {
  resolver 127.0.0.53 valid=30s ipv6=off;
  resolver_timeout 2s;

  # Replace these with your RateLimitly tenant domain and API key.
  ratelimitly_tenant   c-5107024729143590554.p0.ratelimitly.com;
  ratelimitly_auth_key rl-aes1REPLACE_WITH_YOUR_KEY;

  ratelimitly_timeout  50ms;
  ratelimitly_fail     close;
  ratelimitly_debug    off;

  ratelimitly_zone api bucket="api:$binary_remote_addr:$request_method:$uri" rate=100r/s;

  server {
    listen 8080;

    location /api/ {
      ratelimitly_label "api:$request_method:$uri";
      ratelimitly zone=api;
      proxy_pass http://127.0.0.1:9000;
    }
  }
}
